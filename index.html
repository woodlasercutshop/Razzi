<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beauty salon Razzi</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#7b3ff2"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="config.js"></script><style>
:root{--bg:#fff6fb;--cd:#fff;--tx:#2a1530;--mu:#7d6a85;--p:#e0359a;--v:#7b3ff2;--g:#f5b942;--bd:#f1dcea;--gr:linear-gradient(135deg,#e0359a,#7b3ff2);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#190f21;--cd:#261632;--tx:#fbeef8;--mu:#b9a3c4;--bd:#3d2650;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#190f21;--cd:#261632;--tx:#fbeef8;--mu:#b9a3c4;--bd:#3d2650;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column}
header{background:var(--gr);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font:700 20px Georgia,serif;margin:0;letter-spacing:.5px}
.seg{display:flex;background:rgba(255,255,255,.2);border-radius:20px;padding:2px}
.seg button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:18px;font-size:13px}
.seg .on{background:#fff;color:var(--p);font-weight:700}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:var(--cd);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0 10px;font-size:12px;position:relative}
nav button span{display:block;font-size:20px}nav .on{color:var(--p);font-weight:700}
.bd{position:absolute;top:4px;left:55%;background:var(--p);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.hero{background:var(--gr);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px}
.hero h2{margin:0 0 6px;font:700 24px Georgia,serif}.hero p{margin:0 0 12px;opacity:.9}
.btn{border:0;border-radius:14px;padding:10px 16px;font-weight:700;background:var(--g);color:#3a2300}
.btn.s{background:var(--cd);color:var(--p);border:1px solid var(--bd);padding:6px 10px;font-size:13px}
h3{margin:16px 0 8px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.svc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:var(--tx);font:inherit}
.svc i{font-style:normal;flex:none;font-size:28px;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#ffd6ec,#e4d4ff)}
.svc b{display:block}.svc small{color:var(--mu)}.pr{margin-left:auto;color:var(--p);font-weight:700;white-space:nowrap;font-size:13px}
.svc{position:relative;padding:14px;border-radius:20px;background:linear-gradient(135deg,var(--cd),rgba(224,53,154,.08));box-shadow:0 6px 18px rgba(123,63,242,.15)}
.ic{position:relative;flex:none;width:72px;height:72px;border-radius:50%;padding:3px;background:var(--gr);box-shadow:0 0 14px rgba(224,53,154,.45);display:block}
.ic u{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--cd)}
.ic em{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-style:normal;font-size:14px;border:2px solid var(--cd)}
.svc b{font-size:16px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal div{aspect-ratio:1;border-radius:16px;box-shadow:0 4px 12px rgba(123,63,242,.25);border:2px solid var(--cd)}
a{color:var(--p)}
#chat{display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 12px;border-radius:16px;white-space:pre-line}
.m.b{background:var(--cd);border:1px solid var(--bd);border-bottom-left-radius:4px}
.m.u{align-self:flex-end;background:var(--gr);color:#fff;border-bottom-right-radius:4px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ch button{border:1px solid var(--p);background:var(--cd);color:var(--p);border-radius:16px;padding:7px 12px;font-size:14px}
.inp{display:flex;gap:6px;padding:8px 14px;background:var(--cd);border-top:1px solid var(--bd)}
.inp input{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:18px;padding:9px 14px;font-size:15px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.new{border-color:var(--p);box-shadow:0 0 0 2px rgba(224,53,154,.2)}
.tag{background:var(--p);color:#fff;border-radius:8px;font-size:11px;padding:1px 6px}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:6px 0;font-size:12px}
.cal .off{background:#ddd;color:#888;text-decoration:line-through}.cal .hd{border:0;background:none;color:var(--mu)}
.cal .bk{border-color:var(--p);font-weight:700}
.sw{width:44px;height:24px;border-radius:12px;border:0;background:#cbbfd2;position:relative}
.sw.on{background:var(--p)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{left:23px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);background:#2a1530;color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:9;max-width:92%}

header{gap:8px}header h1{flex:1}.hb{border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;border-radius:10px;width:36px;height:36px}#st{font-size:14px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--cd);z-index:21;transform:translateX(-105%);transition:.25s;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px;overflow-y:auto}#dr.on{transform:none}
#dr h3{margin:0 0 10px;color:var(--p)}#dr button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:13px 8px;font-size:16px;border-bottom:1px solid var(--bd)}
.f{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;margin:6px 0}
.pf{display:flex;align-items:center;border:1px solid var(--bd);background:var(--bg);border-radius:12px;margin:6px 0;padding-left:12px}.pf span{font-weight:700;color:var(--p)}.pf input{flex:1;border:0;background:none;color:var(--tx);font:inherit;padding:10px 12px;outline:0;min-width:0}.mu{color:var(--mu)}.pe{font-size:30px}.bar{height:10px;border-radius:6px;background:var(--bd);margin:8px 0}.bar i{display:block;height:100%;border-radius:6px;background:var(--gr)}
.st button{border:0;background:none;font-size:28px;color:#ccc}.st .on{color:var(--g)}label{font-size:13px}
.card{overflow-wrap:anywhere}

nav{padding:4px 4px 2px}nav button{font-size:11px;letter-spacing:.2px}nav button span{display:flex;width:max-content;margin:0 auto 2px;padding:5px 16px;border-radius:16px;transition:.2s}nav svg{display:block}nav .on span{background:rgba(224,53,154,.14)}nav .on svg{stroke-width:2.1}
.bd{top:2px;left:58%}
#dr button{display:flex;gap:14px;align-items:center}#dr svg{color:var(--p)}
.svc i.si{flex:none;width:54px;height:54px;border-radius:16px;background:var(--gr);color:#fff;font-size:0;display:grid;place-items:center;font-style:normal;box-shadow:0 6px 14px rgba(123,63,242,.3)}
.hb{display:grid;place-items:center}
.pc{padding:0;overflow:hidden}.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.car::-webkit-scrollbar{display:none}.car>div{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3}
.dots{display:flex;justify-content:center;gap:6px;margin:-22px 0 8px;position:relative}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}.dots i.on{background:#fff;width:18px;border-radius:4px}
.ph{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,#ffd6ec,#e4d4ff);color:var(--p)}
.pi{padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pth{display:flex;gap:8px;margin-top:8px}.pth>div,.pth .add{width:72px;height:72px;border-radius:12px;position:relative;flex:none}.pth button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;line-height:1;padding:0}
.pth .add{border:1.5px dashed var(--p);color:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:30}.lbx{height:100%}.lbx>div{aspect-ratio:auto;height:100%}.lbk{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}
</style></head><body>

 <div class="card"><b>👤 Админ мастера</b><label style="display:block">Имя админа (логин)</label><input class="f" id="adn" value="${esc(c.an||'')}" placeholder="Новое имя" autocapitalize="off"><label>Текущий пароль</label><input class="f" id="ado" type="password"><label>Новый пароль (минимум 6 символов)</label><input class="f" id="adp" type="password"><button class="btn" onclick="sadm()">Сохранить имя и пароль</button></div>
 <div class="card">Облако: ${CLOUD.url?'подключено ☁️':'не подключено 💾 (данные только на этом устройстве, см. SETUP.md)'}<br><button class="btn s" onclick="sync();toast('Синхронизация…')">Синхронизировать</button> <button class="btn s" onclick="chkCloud()">Проверить облако</button> <button class="btn s" onclick="mlo()">Выйти из кабинета</button></div>`}
function prodAdmin(){return col('P').map(p=>{const im=p.im||[];return `<div class="card"><div class="row"><b>${esc(p.n)}</b><button class="btn s" onclick="pe('${p.id}')">Изменить</button></div><div class="mu">${money(p.p)} · скидка ${p.d||0}%</div><div class="pth">${im.map((u,i)=>`<div style="background:url(${u}) center/cover"><button onclick="pdel('${p.id}',${i})">×</button></div>`).join('')}${im.length<3?`<label class="add">${ico('camera',22)}<small>${im.length}/3</small><input type="file" accept="image/*" multiple hidden onchange="padd('${p.id}',this)"></label>`:''}</div><div style="margin-top:8px"><button class="btn s" onclick="pd('${p.id}')">Скидка %</button> <button class="btn s" onclick="if(confirm('Удалить товар?')){rm('P','${p.id}');rSet()}">Удалить</button></div></div>`}).join('')}
async function padd(id,inp){const p=getI('P',id);p.im=p.im||[];for(const f of[...inp.files].slice(0,3-p.im.length))p.im.push(await img(f,640,.68));put('P',p);rSet()}
function pdel(id,i){const p=getI('P',id);p.im.splice(i,1);put('P',p);rSet()}
function pe(id){const p=getI('P',id),n=prompt('Название',p.n);if(n===null)return;const c=prompt('Цена, ₸',p.p);if(c===null)return;p.n=n.trim()||p.n;p.p=+c||p.p;put('P',p);rSet()}
function pd(id){const p=getI('P',id),v=prompt('Скидка на товар, %',p.d||0);if(v!==null){p.d=Math.max(0,Math.min(60,+v||0));put('P',p);rSet()}}
function ap(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!p)return toast('Название и цена');put('P',{id:'p'+Date.now(),n,e:'🧴',p,d:0});rSet()}
async function genR(){const g=$('#gen');if(!g)return;const u=col('U'),left=180-(Math.floor(Date.now()/1000)%180),cs=await Promise.all(u.map(x=>totp(x.sec)));if(!$('#gen'))return;
 g.innerHTML=u.length?u.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(x.name)}</b><br><small class="mu">+${esc(x.phone)}</small></span><span style="text-align:right"><b style="font-size:26px;letter-spacing:4px;color:var(--p)">${cs[i]}</b><br><small class="mu">${Math.floor(left/60)}:${p2(left%60)}</small></span></div>`).join('')+`<div class="bar"><i style="width:${left/180*100}%"></i></div>`:'<p class="mu">Клиентов пока нет.</p>'}
async function sadm(){const n=$('#adn').value.trim(),o=$('#ado').value,w=$('#adp').value,c=CF();if(!n||w.length<6)return toast('Имя обязательно. Пароль: минимум 6 символов');
 if(!(await chk(c.an||c.wa,o)))return toast('Текущий пароль неверный');setCF({an:n,ah:await sha(w)});$('#ado').value=$('#adp').value='';toast('Имя и пароль админа сохранены')}
const mlo=()=>{mAuth=0;setRole('c')};
setInterval(()=>{if(tab=='set'&&mAuth)genR()},1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
nav();R();sync();rt();setInterval(sync,10000);addEventListener('online',()=>{sync();rt()});

</script></body></html>
